name: NOVARA quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Verify Expo dependency compatibility
        run: npx expo install --check
      - name: TypeScript check
        run: npm run typecheck
      - name: Storage format tests
        run: npm test
      - name: Build web app
        run: npm run build:web
